name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel in-progress runs on the changesets release branch: rapid
  # force-pushes would otherwise cancel the required checks before they
  # complete on the final head SHA, leaving the release PR permanently BLOCKED.
  cancel-in-progress: ${{ github.head_ref != 'changeset-release/main' }}

permissions: read-all

env:
  NODE_VERSION: 24.x
  PNPM_VERSION: 11.5.2

jobs:
  test:
    runs-on: ubuntu-latest
    name: Coverage
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install with pnpm
        run: pnpm install
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: CodeClimate
        continue-on-error: true
        uses: paambaati/codeclimate-action@f429536ee076d758a24705203199548125a28ca7 # v9.0.0
        env:
          CC_TEST_REPORTER_ID: ${{ secrets.CODECLIMATE_TEST_REPORTER_ID }}
        with:
          coverageLocations: ${{github.workspace}}/coverage/lcov.info:lcov

  redis:
    runs-on: ubuntu-latest
    name: Redis driver (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: redis:6.2
            cli: redis-cli
          - image: redis:7.2
            cli: redis-cli
          - image: valkey/valkey:8
            cli: valkey-cli
          - image: valkey/valkey:9
            cli: valkey-cli
    services:
      redis:
        image: ${{ matrix.image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "${{ matrix.cli }} ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      VALKEYRIE_TEST_DRIVER: redis
      VALKEYRIE_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install with pnpm
        run: pnpm install
      - name: Run the shared suite and the driver tests
        run: node --test ./test/valkeyrie.ts ./test/redis-driver.ts

  redis-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    name: Redis Cluster driver
    env:
      VALKEYRIE_TEST_REDIS_CLUSTER_URL: redis://127.0.0.1:17300
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        name: Use Node.js
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        name: Install pnpm
        with:
          version: ${{ env.PNPM_VERSION }}
      - run: pnpm install
        name: Install with pnpm
      - name: Start the cluster
        run: |
          docker run -d --name redis-cluster -p 17300:17300 -p 17301:17301 \
            -v "$PWD/test/fixtures/redis-cluster.sh:/cluster.sh:ro" \
            redis:7.2 sh /cluster.sh
          for attempt in $(seq 1 40); do
            if docker exec redis-cluster test -f /tmp/cluster-ready; then
              exit 0
            fi
            sleep 1
          done
          docker logs redis-cluster
          exit 1
      - name: Test primary reads and replica lag
        run: node --test ./test/redis-cluster.ts
      - name: Stop the cluster
        if: always()
        run: docker rm -f redis-cluster
